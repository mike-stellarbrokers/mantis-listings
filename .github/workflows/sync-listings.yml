name: Sync Mantis listings

# Runs the fetch-listings.js script on GitHub's own servers, on a schedule,
# and commits the refreshed listings.json back to the repo. No local
# computer or terminal needed once this is in place.
#
# Requires two repository secrets (Settings > Secrets and variables >
# Actions): MANTIS_AGENCY_ID and MANTIS_API_KEY.

on:
  schedule:
    # Runs at the top of every hour (UTC). GitHub may delay a few minutes
    # under load — that's normal. Adjust if hourly is more/less than needed.
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger a sync manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit listings.json back

concurrency:
  group: sync-listings
  cancel-in-progress: false # let an in-flight run finish rather than racing it

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          MANTIS_AGENCY_ID: ${{ secrets.MANTIS_AGENCY_ID }}
          MANTIS_API_KEY: ${{ secrets.MANTIS_API_KEY }}
          MANTIS_INCLUDE_SOLD: "true"
        run: node fetch-listings.js

      - name: Commit updated listings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listings.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync listings from MantisProperty [skip ci]"

          # If another run pushed in the meantime, catch up and retry.
          # listings.json is fully regenerated from Mantis every run (not
          # hand-edited), so there's nothing to line-merge — a rebase can
          # hit a real conflict (e.g. two runs both changing the
          # "generatedAt" timestamp) and get stuck. Instead, just move our
          # already-made commit on top of the latest main and recommit.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying (attempt $i)..."
            git fetch origin main
            git reset --soft origin/main
            if git diff --staged --quiet; then
              echo "Another run already published this data. Nothing more to do."
              exit 0
            fi
            git commit -m "Sync listings from MantisProperty [skip ci]"
          done
          echo "Failed to push after retries."
          exit 1
