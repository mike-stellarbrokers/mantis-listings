<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stellar Accommodation Brokers — Listings (example)</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f6f3;
    color: #1c1c1c;
  }
  header {
    padding: 24px 32px;
    background: #fff;
    border-bottom: 1px solid #e5e2da;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: #666; font-size: 14px; }
  main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e2da;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #eee;
  }
  .card-body { padding: 14px 16px 18px; flex: 1; display: flex; flex-direction: column; }
  .card h2 { font-size: 16px; margin: 0 0 6px; line-height: 1.3; }
  .card .location { color: #777; font-size: 13px; margin-bottom: 8px; }
  .card .price { font-weight: 600; margin-top: auto; padding-top: 10px; }
  .empty, .error { padding: 40px; text-align: center; color: #777; }
</style>
</head>
<body>
<header>
  <h1>Businesses for Sale</h1>
  <p>Example page — renders listings.json produced by fetch-listings.js</p>
</header>
<main>
  <div id="content" class="empty">Loading listings…</div>
</main>
<script>
  // In the real site this fetches the static listings.json that the
  // sync script (fetch-listings.js) produces on a schedule — never the
  // Mantis API directly, since that would expose the API key.
  fetch("/listings.json")
    .then((r) => {
      if (!r.ok) throw new Error("listings.json not found — run `npm run sync` first");
      return r.json();
    })
    .then((data) => render(data.listings))
    .catch((err) => {
      document.getElementById("content").className = "error";
      document.getElementById("content").textContent = err.message;
    });

  function render(listings) {
    const content = document.getElementById("content");
    const active = listings.filter((l) => !l.sold && !l.archived);

    if (active.length === 0) {
      content.className = "empty";
      content.textContent = "No current listings.";
      return;
    }

    content.className = "grid";
    content.innerHTML = active
      .map((l) => {
        const photo = l.photos[0]?.mid || l.photos[0]?.full || "";
        const location = [l.address.suburb, l.address.state]
          .filter(Boolean)
          .join(", ");
        return `
          <div class="card">
            ${photo ? `<img src="${escapeAttr(photo)}" alt="">` : ""}
            <div class="card-body">
              <h2>${escapeHtml(l.heading || "Untitled listing")}</h2>
              <div class="location">${escapeHtml(location)}</div>
              <div class="price">${escapeHtml(l.displayPrice || "")}</div>
            </div>
          </div>
        `;
      })
      .join("");
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }
</script>
</body>
</html>
